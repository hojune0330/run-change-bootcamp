name: Security database gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    container: postgres:17.10
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PSQL_BIN: psql
      SECURITY_DATABASE_URL: postgresql://postgres@postgres:5432/postgres
      SECURITY_EVIDENCE_DIR: .omo/evidence/security-ci
      SUPABASE_BIN: supabase
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Supabase CLI archive prerequisite
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@6ffe784b57613e98e0c04651e5fde0cec28cb1c9
        with:
          version: 2.111.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute PostgreSQL security gate
        run: pnpm test:security

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-evidence
          path: .omo/evidence/security-ci
          if-no-files-found: error
